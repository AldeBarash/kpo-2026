server:
  port: 8080

spring:
  application:
    name: ai-token-gateway
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ai_gateway}
    username: ${SPRING_DATASOURCE_USERNAME:ai_gateway}
    password: ${SPRING_DATASOURCE_PASSWORD:ai_gateway}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  ai:
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${APP_OLLAMA_MODEL:qwen2.5:0.5b}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

