services:
  gateway:
    build:
      context: ../..
      dockerfile: modules/practise-10-res/gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://gateway-db:5432/ai_gateway
      SPRING_DATASOURCE_USERNAME: ai_gateway
      SPRING_DATASOURCE_PASSWORD: ai_gateway
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-development-service-token-change-me}
      OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-1000}
      DELIVERY_MAX_ATTEMPTS: ${DELIVERY_MAX_ATTEMPTS:-8}
      DELIVERY_LEASE_SECONDS: ${DELIVERY_LEASE_SECONDS:-60}
      DELIVERY_RETRY_SECONDS: ${DELIVERY_RETRY_SECONDS:-2}
      DELIVERY_MAX_RETRY_SECONDS: ${DELIVERY_MAX_RETRY_SECONDS:-300}
      APP_OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
    depends_on:
      gateway-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      ollama-pull:
        condition: service_completed_successfully
    networks:
      - ai-gateway-network

  telegram-service:
    build:
      context: ../..
      dockerfile: modules/practise-10-res/telegram-service/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://telegram-db:5432/telegram
      SPRING_DATASOURCE_USERNAME: telegram
      SPRING_DATASOURCE_PASSWORD: telegram
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      GATEWAY_BASE_URL: http://gateway:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-development-service-token-change-me}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      KAFKA_CONSUMER_ENABLED: ${KAFKA_CONSUMER_ENABLED:-true}
      DELIVERY_MAX_ATTEMPTS: ${DELIVERY_MAX_ATTEMPTS:-8}
      DELIVERY_LEASE_SECONDS: ${DELIVERY_LEASE_SECONDS:-60}
      DELIVERY_RETRY_SECONDS: ${DELIVERY_RETRY_SECONDS:-2}
      DELIVERY_MAX_RETRY_SECONDS: ${DELIVERY_MAX_RETRY_SECONDS:-300}
    depends_on:
      telegram-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - ai-gateway-network

  gateway-db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ai_gateway
      POSTGRES_USER: ai_gateway
      POSTGRES_PASSWORD: ai_gateway
    volumes:
      - gateway_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_gateway -d ai_gateway"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ai-gateway-network

  telegram-db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: telegram
      POSTGRES_USER: telegram
      POSTGRES_PASSWORD: telegram
    volumes:
      - telegram_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telegram -d telegram"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ai-gateway-network

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    networks:
      - ai-gateway-network

  ollama-pull:
    image: ollama/ollama:latest
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - ollama pull "$${OLLAMA_MODEL}"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - ai-gateway-network

  kafka:
    image: apache/kafka:4.0.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
    networks:
      - ai-gateway-network

  kafka-init:
    image: apache/kafka:4.0.1
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic billing.credits-charged.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic billing.credits-charged.dlt --partitions 3 --replication-factor 1
    networks:
      - ai-gateway-network

networks:
  ai-gateway-network:
    driver: bridge

volumes:
  kafka_data:
  gateway_db_data:
  telegram_db_data:
  ollama_data:

