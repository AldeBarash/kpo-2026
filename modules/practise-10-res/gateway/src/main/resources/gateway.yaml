server:
  port: 8080

spring:
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  task:
    scheduling:
      pool:
        size: 4
  application:
    name: ai-token-gateway
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ai_gateway}
    username: ${SPRING_DATASOURCE_USERNAME:ai_gateway}
    password: ${SPRING_DATASOURCE_PASSWORD:ai_gateway}
  liquibase:
    enabled: true
    change-log: classpath:db/gateway/changelog/db.changelog-master.yaml
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  ai:
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${APP_OLLAMA_MODEL:qwen2.5:0.5b}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true


app:
  delivery:
    topic: billing.credits-charged.v1
    dlt: billing.credits-charged.dlt
    poll-ms: ${OUTBOX_POLL_MS:1000}
    max-attempts: ${DELIVERY_MAX_ATTEMPTS:8}
    lease-seconds: ${DELIVERY_LEASE_SECONDS:60}
    retry-seconds: ${DELIVERY_RETRY_SECONDS:2}
    max-retry-seconds: ${DELIVERY_MAX_RETRY_SECONDS:300}
  internal:
    token: ${INTERNAL_API_TOKEN:local-development-service-token-change-me}
