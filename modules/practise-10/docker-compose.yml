services:
  application:
    build:
      context: ../..
      dockerfile: modules/practise-10/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ai_gateway
      SPRING_DATASOURCE_USERNAME: ai_gateway
      SPRING_DATASOURCE_PASSWORD: ai_gateway
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
      APP_OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
    depends_on:
      postgres:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    networks:
      - ai-gateway-network

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ai_gateway
      POSTGRES_USER: ai_gateway
      POSTGRES_PASSWORD: ai_gateway
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ai_gateway -d ai_gateway
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ai-gateway-network

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    networks:
      - ai-gateway-network

  ollama-pull:
    image: ollama/ollama:latest
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - ollama pull "$${OLLAMA_MODEL}"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - ai-gateway-network

networks:
  ai-gateway-network:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:

