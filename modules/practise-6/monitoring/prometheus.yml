global:
  scrape_interval: 5s

scrape_configs:
  - job_name: notification-delivery
    # base-path Actuator в application.yaml равен "/", поэтому не /actuator/prometheus
    metrics_path: /prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
        # метки нужны JVM-дашборду (переменные $application и $namespace)
        labels:
          application: notification-delivery
          namespace: default
