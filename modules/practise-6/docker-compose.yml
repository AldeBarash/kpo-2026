# Мониторинг приложения: Prometheus собирает метрики, Grafana их показывает.
# Приложение запускается на компьютере (bootRun), а не в Docker.
#
#   docker compose up -d
#   Prometheus: http://localhost:9090
#   Grafana:    http://localhost:3000  (логин admin, пароль admin)
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: practise6-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # Позволяет контейнеру обращаться к приложению на вашем компьютере.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:12.1.0
    container_name: practise6-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  grafana-data:
