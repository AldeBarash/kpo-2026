services:
  application:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      LOGGING_FILE_NAME: /var/log/application/application.json
      LOGGING_STRUCTURED_FORMAT_FILE: ecs
      LOGGING_LOGBACK_ROLLINGPOLICY_FILE_NAME_PATTERN: /var/log/application/application.%d{yyyy-MM-dd}.%i.json
      LOGGING_LOGBACK_ROLLINGPOLICY_MAX_FILE_SIZE: 10MB
      LOGGING_LOGBACK_ROLLINGPOLICY_MAX_HISTORY: 7
      LOGGING_LOGBACK_ROLLINGPOLICY_TOTAL_SIZE_CAP: 100MB
    volumes:
      - application_logs:/var/log/application
    networks:
      - monitoring-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    mem_limit: 1g
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"
      interval: 10s
      timeout: 10s
      retries: 30
    networks:
      - monitoring-network

  logstash:
    image: docker.elastic.co/logstash/logstash:9.2.3
    restart: unless-stopped
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
    volumes:
      - ./logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - application_logs:/var/log/application:ro
      - logstash_data:/usr/share/logstash/data
    mem_limit: 768m
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - monitoring-network

  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.3
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:5601:5601"
    volumes:
      - kibana_data:/usr/share/kibana/data
    mem_limit: 1g
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - monitoring-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - monitoring-network

  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - monitoring-network
    depends_on:
      - prometheus

networks:
  monitoring-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  application_logs:
  elasticsearch_data:
  logstash_data:
  kibana_data:
