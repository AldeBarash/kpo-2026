input {
  file {
    path => "/var/log/application/*.json"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/application.sincedb"
    codec => json
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "notification-delivery-%{+yyyy.MM.dd}"
    data_stream => false
    ilm_enabled => false
    manage_template => false
  }
}
